name: Database Tests

on:
  push:
    branches:
      - feature/autonomous-agent-studio

permissions:
  contents: read

concurrency:
  group: db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: studio

    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install Studio dependencies
        run: npm ci

      - name: Install the isolated Chromium test browser
        run: npx playwright install --with-deps chromium

      - name: Run Studio unit tests
        run: npm test

      - name: Run strict TypeScript checks
        run: npm run typecheck

      - name: Build the Studio
        run: npm run build

      - name: Run Studio browser tests
        run: npm run test:browser

  windows-runner:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test runner with PowerShell 7
        shell: pwsh
        run: ./tests/Runner.Tests.ps1

      - name: Test broker with PowerShell 7
        shell: pwsh
        run: ./tests/Broker.Tests.ps1

      - name: Test runner with Windows PowerShell 5.1
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tests\Runner.Tests.ps1

      - name: Test broker with Windows PowerShell 5.1
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tests\Broker.Tests.ps1

  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start isolated Supabase services
        run: npx --yes supabase@2.122.0 start

      - name: Run orchestration database tests
        run: npx --yes supabase@2.122.0 test db supabase/tests/ops_orchestration_test.sql

      - name: Run mission control database tests
        run: npx --yes supabase@2.122.0 test db supabase/tests/ops_missions_controls_test.sql

      - name: Run concurrent claim test
        run: bash supabase/tests/concurrent_claim_test.sh

      - name: Lint the private ops schema
        run: npx --yes supabase@2.122.0 db lint --local --schema ops --level warning --fail-on warning

      - name: Run local database advisors
        run: npx --yes supabase@2.122.0 db advisors --local --type all --level warn --fail-on error

      - name: Stop isolated Supabase services
        if: always()
        run: npx --yes supabase@2.122.0 stop --no-backup
