name: Database Tests

on:
  push:
    branches:
      - feature/autonomous-agent-studio

permissions:
  contents: read

concurrency:
  group: db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start isolated Supabase services
        run: npx --yes supabase@2.122.0 start

      - name: Run orchestration database tests
        run: npx --yes supabase@2.122.0 test db supabase/tests/ops_orchestration_test.sql

      - name: Lint the private ops schema
        run: npx --yes supabase@2.122.0 db lint --local --schema ops --level warning --fail-on warning

      - name: Run local database advisors
        run: npx --yes supabase@2.122.0 db advisors --local --type all --level warn --fail-on error

      - name: Stop isolated Supabase services
        if: always()
        run: npx --yes supabase@2.122.0 stop --no-backup
