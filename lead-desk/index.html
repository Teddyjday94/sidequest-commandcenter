<title>Sidequest Lead Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one working column. Lane tabs on top, a list of lead rows that open in place with the actions under them. */
:root {
  --bg: #f6f7f5;
  --panel: #ffffff;
  --ink: #18201d;
  --muted: #5d6963;
  --line: #dde2de;
  --accent: #1d6b57;
  --accent-ink: #ffffff;
  --hot: #b4361f;
  --warm: #9a6400;
  --ok: #217a3c;
  --chip: #e9eeea;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --panel: #18201c; --ink: #e6ece8; --muted: #9aa8a1; --line: #2b3631;
    --accent: #4fb596; --accent-ink: #0d1411; --hot: #f0846c; --warm: #e0b04f; --ok: #6fcf8a; --chip: #232d28;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --panel: #18201c; --ink: #e6ece8; --muted: #9aa8a1; --line: #2b3631;
  --accent: #4fb596; --accent-ink: #0d1411; --hot: #f0846c; --warm: #e0b04f; --ok: #6fcf8a; --chip: #232d28;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 60rem; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; display: grid; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; }
h1 { font-family: var(--display); font-stretch: 80%; font-weight: 800; font-size: 2rem; letter-spacing: -0.01em; margin: 0; line-height: 1; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 40rem; }
.status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.status button, .btn { font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border-radius: 8px; padding: 8px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.btn:hover, .status button:hover { border-color: var(--muted); }
.btn:focus-visible, .lane:focus-visible, .row-head:focus-visible, input:focus-visible, .status button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--hot); }
.btn[disabled] { opacity: .5; cursor: progress; }

.lanes { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.lane { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 7px 14px; white-space: nowrap; display: flex; gap: 8px; align-items: baseline; }
.lane .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.lane[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.lane[aria-pressed="true"] .n { color: var(--bg); opacity: .75; }
.lane-note { color: var(--muted); font-size: 13px; margin: -6px 0 0; }

.search { display: flex; gap: 8px; }
.search input { flex: 1; min-width: 0; font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }

.list { display: grid; gap: 8px; }
.lead { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.lead.open { border-color: var(--muted); }
.row-head { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 14px; }
.nm { font-family: var(--display); font-stretch: 90%; font-weight: 700; font-size: 1.08rem; line-height: 1.2; }
.meta { color: var(--muted); font-size: 13px; }
.right { text-align: right; display: grid; justify-items: end; gap: 4px; }
.score { font-family: var(--mono); font-size: 13px; }
.heat { font-weight: 600; font-size: 13px; }
.heat.Hot { color: var(--hot); } .heat.Warm { color: var(--warm); } .heat.Cold { color: var(--muted); }
.next { font-size: 13px; font-weight: 600; color: var(--accent); margin-top: 2px; }
.next b { font-weight: 700; color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; grid-column: 1 / -1; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); }
.chip.off { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.chip.stage { background: transparent; border: 1px solid var(--line); }
.chip.due { background: transparent; border: 1px solid var(--warm); color: var(--warm); }

.body { border-top: 1px solid var(--line); padding: 14px; display: grid; gap: 14px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); gap: 10px 16px; margin: 0; }
.facts dt { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.facts dd { margin: 2px 0 0; overflow-wrap: anywhere; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.copy { font: inherit; font-size: 12px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.quote { margin: 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--bg); white-space: pre-wrap; border-radius: 0 8px 8px 0; }
.qlabel { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.actions { display: grid; gap: 10px; }
.act-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.act-group .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; width: 100%; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
.notes { display: grid; gap: 8px; }
.photos { display: grid; gap: 10px; padding: 14px; border: 1px dashed var(--line); border-radius: 10px; background: var(--bg); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 9rem), 1fr)); gap: 10px; }
.thumb { display: grid; gap: 6px; }
.thumb img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.thumb input { font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); width: 100%; box-sizing: border-box; }
.thumb .rm { font: inherit; font-size: 12px; justify-self: start; background: none; border: 0; color: var(--hot); cursor: pointer; padding: 0; text-decoration: underline; }
.pick { position: relative; overflow: hidden; }
.pick input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.notes textarea { font: inherit; min-height: 6rem; resize: vertical; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; box-sizing: border-box; }
.notes .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.notes .hint { font-size: 12px; color: var(--muted); }
[hidden] { display: none !important; }
.cm { display: grid; gap: 12px; }
.cm-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.cm-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.cm-tabs button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 7px 14px; display: flex; gap: 8px; align-items: baseline; }
.cm-tabs button .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.cm-tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.cm-tabs button[aria-pressed="true"] .n { color: var(--bg); opacity: .75; }
.cm-pos { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.cm-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 14px; }
.cm-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.cm-head .nm { font-size: 1.35rem; }
.cm-num { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cm-num .big { font-family: var(--mono); font-size: 1.6rem; font-weight: 500; letter-spacing: .02em; user-select: all; }
.cm-num a { font-weight: 600; color: var(--accent); }
.cm-results { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); gap: 8px; }
.cm-results .btn { padding: 12px 10px; }
.cm-card details summary { cursor: pointer; font-size: 13px; color: var(--muted); }
.cm-card ul { margin: 0; padding-left: 18px; }
.btn.good { background: var(--ok); color: var(--accent-ink); border-color: var(--ok); }
.notes input[type=email] { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; flex: 1 1 14rem; }
.mail-subj { font-weight: 600; }
.empty, .notice { color: var(--muted); padding: 24px 16px; text-align: center; background: var(--panel); border: 1px dashed var(--line); border-radius: 10px; }
.notice.bad { color: var(--ink); border-style: solid; border-color: var(--hot); text-align: left; }
.notice b { display: block; margin-bottom: 4px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; }
.skeleton { height: 64px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
@media (prefers-reduced-motion: no-preference) {
  .skeleton { animation: pulse 1.2s ease-in-out infinite alternate; }
  @keyframes pulse { from { opacity: .55; } to { opacity: 1; } }
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Lead Desk</h1>
      <p class="sub">Mark who you've emailed, called or messaged, and send leads to the Mockup Builder. Every click updates the command center, and the agents pick it up on their next run.</p>
    </div>
    <div class="status"><span id="updated">Loading leads</span><button id="refresh" type="button">Refresh</button><button id="callmode" class="btn primary" type="button" aria-pressed="false">Call Mode</button></div>
  </header>

  <nav class="lanes" id="lanes" aria-label="Lead groups"></nav>
  <p class="lane-note" id="lane-note"></p>
  <section class="cm" id="cm" hidden aria-label="Call Mode"></section>
  <div class="search"><input id="q" type="search" placeholder="Search by business, town or niche" aria-label="Search leads"></div>
  <div class="list" id="list" aria-live="polite">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(() => {
  const SERVER = 'Supabase';
  const BUILD_TRIGGER = 'trig_01H1NSncvgXqvU1uJeemCkhK'; // Tue/Thu Detective + Mockup Builder task
  const BUILD_KEY = 'leaddesk-building';
  const PROJECT = 'taskvfzqgpqxpdifmxru';
  const COLS = 'id, business, niche, area, rating, website, email, phone, facebook, score, heat, stage, hook, next_step, you_action, mockup_url, mockup_requested, call_script, dm_text, sms_text, sms_followup, voicemail, next_channel, call_attempts, email_subject, email_text, draft_id, first_contact, last_contact, touches, next_followup, my_notes';
  const LIST_SQL = `select ${COLS}, coalesce(d.owner_name, '') as owner_name, coalesce(d.pitch_angles, '') as pitch_angles, (d.lead_id is not null) as has_case, ops.lead_priority(l) as priority, ops.lead_next_move(l) as next_move, coalesce((select sa.issues from ops.site_audits sa where sa.lead_id = l.id), '') as site_issues from ops.leads l left join ops.dossiers d on d.lead_id = l.id where l.stage <> 'Opted out' order by ops.lead_priority(l) desc, l.score desc, l.id`;
  const LANES = [
    { id: 'ready', label: 'Ready to contact', note: 'Researched and not contacted yet, best move first. Reach out, then mark how.', test: (l) => ['New', 'Audited', 'Mockup ready'].includes(l.stage) },
    { id: 'contacted', label: 'Contacted', note: 'You reached out. Follow-ups due today or earlier are flagged.', test: (l) => l.stage === 'Contacted' },
    { id: 'talking', label: 'Talking', note: 'They replied or have a proposal.', test: (l) => ['Replied', 'Proposal sent'].includes(l.stage) },
    { id: 'won', label: 'Won', note: 'The Site Builder is on these.', test: (l) => l.stage === 'Won' },
    { id: 'lost', label: 'Not interested', note: 'Reopen one if they come back around.', test: (l) => l.stage === 'Lost' },
    { id: 'all', label: 'Everyone', note: 'Every lead except anyone who opted out.', test: () => true },
  ];

  const drafts = {};
  let assets = null, photos = {}, uploading = false;
  let mcp = null, leads = [], lane = 'ready', openId = null, confirmFor = null, busy = false, loadedAt = null, problem = null;
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const today = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Chicago' }).format(new Date());
  const shortDate = (d) => d ? new Date(String(d).slice(0, 10) + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
  const safeUrl = (u) => (typeof u === 'string' && /^https?:\/\//.test(u.trim()) ? u.trim() : '');

  try { const saved = localStorage.getItem('leaddesk-lane'); if (LANES.some((l) => l.id === saved)) lane = saved; } catch (e) {}
  const hash = location.hash.slice(1);
  if (/^L\d{1,5}$/.test(hash)) { openId = hash; lane = 'all'; }

  let toastTimer;
  const toast = (msg) => { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200); };

  // Supabase wraps rows in a short note; pull the JSON array out of it.
  const rowsFrom = (payload) => {
    let txt = payload;
    if (txt && typeof txt === 'object') txt = typeof txt.result === 'string' ? txt.result : JSON.stringify(txt);
    if (typeof txt !== 'string') throw { code: 'tool_error', message: 'Supabase sent back something unexpected.' };
    const m = txt.match(/<(untrusted-data-[\w-]+)>\s*(\[[\s\S]*\])\s*<\/\1>/);
    if (!m) throw { code: 'tool_error', message: txt.slice(0, 240) };
    return JSON.parse(m[2]);
  };

  const explain = (err) => {
    const code = err && err.code;
    if (code === 'server_not_connected' || code === 'selection_required' || code === 'server_not_found') return ['Supabase isn’t connected for you', 'Add or pick the Supabase connector in claude.ai Settings, Connectors, then refresh.'];
    if (code === 'needs_reauth') return ['Supabase needs you to sign in again', 'Reconnect Supabase in claude.ai Settings, Connectors, then refresh.'];
    if (code === 'not_in_manifest' || code === 'not_granted' || code === 'consent_required') return ['Supabase is turned off for this page', 'Allow Supabase from this page’s Permissions menu, then refresh.'];
    if (code === 'blocked_by_policy' || code === 'approval_required') return ['Your organization blocks this', 'An admin has to allow Supabase database calls for artifacts.'];
    if (code === 'server_unavailable' || code === 'rate_limited') return ['Supabase didn’t answer', 'Wait a few seconds and press Refresh.'];
    if (code === 'tool_error') return ['Supabase refused that', String(err.message || '').slice(0, 240)];
    return ['Something went wrong talking to Supabase', String((err && err.message) || '').slice(0, 240) || 'Press Refresh to try again.'];
  };

  const sql = (query) => mcp.callTool(SERVER, 'execute_sql', { project_id: PROJECT, query }, { cache: false }).then((r) => rowsFrom(r.payload));

  async function load() {
    if (!mcp) return;
    $('updated').textContent = 'Loading leads';
    try {
      leads = await sql(LIST_SQL);
      const rows = await sql('select asset_id, lead_id, file_name, caption from ops.lead_photos order by created_at');
      photos = {};
      rows.forEach((r) => { (photos[r.lead_id] = photos[r.lead_id] || []).push(r); });
      loadedAt = new Date();
      problem = null;
    } catch (err) {
      problem = explain(err);
      if (['needs_reauth', 'server_not_connected', 'not_in_manifest', 'blocked_by_policy', 'approval_required', 'not_granted'].includes(err && err.code)) leads = [];
    }
    render();
  }

  async function act(lead, action, pkg) {
    if (busy) return;
    if (!/^L\d{1,5}$/.test(lead.id)) return;
    const allowed = ['mockup', 'emailed', 'called', 'messaged', 'replied', 'won', 'lost', 'optout', 'reopen'];
    if (!allowed.includes(action)) return;
    if (action === 'won' && !['Starter', 'Full'].includes(pkg)) return;
    busy = true; confirmFor = null; render();
    const q = `select ops.lead_action('${lead.id}', '${action}', ${pkg ? `'${pkg}'` : 'null'}) as done`;
    try {
      await sql(q);
      const words = { mockup: 'Sent to the Mockup Builder', emailed: 'Marked emailed', called: 'Marked called', messaged: 'Marked messaged', replied: 'Marked replied', won: 'Marked won', lost: 'Marked not interested', optout: 'Marked opted out', reopen: 'Reopened' };
      toast(words[action] + ': ' + lead.business);
    } catch (err) {
      const [t, d] = explain(err);
      toast(t + '. ' + (err && err.code === 'server_unavailable' ? 'It may or may not have saved, so refresh before trying again.' : d));
    }
    busy = false;
    await load();
  }

  // Build it now: queue the mockup, then start the Tue/Thu builder task right away for just this lead.
  const building = (() => { try { return JSON.parse(localStorage.getItem(BUILD_KEY) || '{}'); } catch (e) { return {}; } })();
  const buildingSince = (id) => {
    const l = leads.find((x) => x.id === id);
    return (building[id] && Date.now() - building[id] < 60 * 60 * 1000 && (!l || l.mockup_requested)) ? new Date(building[id]) : null;
  };
  async function buildNow(lead) {
    if (busy || !/^L\d{1,5}$/.test(lead.id) || buildingSince(lead.id)) return;
    busy = true; render();
    let queued = !!lead.mockup_requested;
    try {
      if (!queued) { await sql(`select ops.lead_action('${lead.id}', 'mockup', null) as done`); queued = true; }
      await mcp.callTool('Claude Code Remote', 'fire_trigger', { trigger_id: BUILD_TRIGGER, text: `On-demand mockup for lead ${lead.id}. Build only this lead's mockup now, following section 3 of the playbook.` }, { cache: false });
      building[lead.id] = Date.now();
      try { localStorage.setItem(BUILD_KEY, JSON.stringify(building)); } catch (e) { /* per-viewer only */ }
      toast('Builder started for ' + lead.business + '. The mockup link shows up here in about 15 to 30 minutes; press Refresh to check.');
    } catch (err) {
      const code = err && err.code;
      const why = ['not_in_manifest', 'not_granted', 'consent_required'].includes(code) ? 'Allow Claude Code Remote in this page\u2019s Permissions menu to start it now.'
        : code === 'server_not_connected' || code === 'needs_reauth' ? 'Claude Code Remote is not connected for you right now.'
        : 'The builder did not start (' + String((err && (err.code || err.message)) || 'unknown').slice(0, 80) + ').';
      toast(why + (queued ? ' The mockup is still queued for the next Tue or Thu run.' : ''));
    }
    busy = false;
    await load();
  }

  async function saveNote(lead) {
    if (busy || !/^L\d{1,5}$/.test(lead.id)) return;
    const text = String(drafts[lead.id] ?? lead.my_notes ?? '').replace(/\u0000/g, '').slice(0, 4000);
    busy = true; render();
    try {
      await sql(`select ops.lead_note('${lead.id}', '${text.replace(/'/g, "''")}') as saved`);
      delete drafts[lead.id];
      toast('Notes saved for ' + lead.business);
    } catch (err) {
      const [t, d] = explain(err);
      toast(t + '. ' + d);
    }
    busy = false;
    await load();
  }

  const okAsset = (id) => /^[A-Za-z0-9_-]{16,64}$/.test(String(id || ''));
  const q = (t) => "'" + String(t ?? '').replace(/\u0000/g, '').replace(/'/g, "''") + "'";
  const IMAGE_TYPES = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];

  async function uploadPhotos(lead, files) {
    if (!assets || uploading || !/^L\d{1,5}$/.test(lead.id)) return;
    const list = [...files].filter((f) => IMAGE_TYPES.includes(f.type) && f.size > 0 && f.size <= 20 * 1024 * 1024);
    const skipped = files.length - list.length;
    if (!list.length) { toast('Pick JPG, PNG, WebP or GIF photos under 20 MB.'); return; }
    uploading = true; render();
    let saved = 0;
    for (const f of list) {
      try {
        const up = await assets.upload(f, { type: f.type });
        if (!okAsset(up.id)) continue;
        await sql(`select ops.add_lead_photo('${lead.id}', '${up.id}', ${q(f.name.slice(0, 200))}, ${q(f.type)}) as saved`);
        saved++;
      } catch (err) {
        const c = err && err.code;
        toast(c === 'too_large' ? f.name + ' is too big.' : c === 'quota_or_state' ? 'Lead Desk is out of photo storage. Remove some old photos.' : c === 'rate_limited' ? 'Slow down a little, then try again.' : 'Could not upload ' + f.name + '.');
      }
    }
    uploading = false;
    toast(`Added ${saved} photo${saved === 1 ? '' : 's'} for ${lead.business}` + (skipped ? ` (skipped ${skipped} that weren't photos)` : ''));
    await load();
  }

  async function captionPhoto(p, text) {
    if (!okAsset(p.asset_id)) return;
    try { await sql(`select ops.caption_lead_photo('${p.asset_id}', ${q(String(text).slice(0, 200))}) as saved`); p.caption = text; }
    catch (err) { toast('Could not save that caption.'); }
  }

  async function removePhoto(lead, p) {
    if (busy || !okAsset(p.asset_id)) return;
    busy = true; render();
    try {

  async function saveEmail(lead) {

    if (busy || !/^L\d{1,5}$/.test(lead.id)) return;
    if (!/^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/.test(e) || e.length > 200) { toast('That doesn’t look like an email address.'); return; }
    busy = true; render();
    try { await sql(`select ops.lead_set_email('${lead.id}', ${q(e)}) as saved`); delete emailDrafts[lead.id]; toast('Email saved for ' + lead.business); }
    catch (err) { const [t, d] = explain(err); toast(t + '. ' + d); }
    busy = false;
    await load();
  }
  async function makeDraft(lead) {
    if (busy || !/^L\d{1,5}$/.test(lead.id) || !lead.email || !lead.email_text) return;
    busy = true; render();
    try {
      const r = await mcp.callTool('Gmail', 'create_draft', { to: [lead.email], subject: lead.email_subject || ('Website for ' + lead.business), body: lead.email_text }, { cache: false });
      const m = JSON.stringify(r && r.payload).match(/\\?"id\\?"\s*:\s*\\?"([A-Za-z0-9_-]{5,100})/);
      if (!m) throw { code: 'tool_error', message: 'Gmail did not say whether the draft was made. Check your Drafts folder before trying again.' };
      await sql(`select ops.lead_set_draft('${lead.id}', ${q(m[1])}) as saved`);
      toast('Draft is in Gmail for ' + lead.business);
    } catch (err) {
      const code = err && err.code;
      if (code === 'server_not_connected' || code === 'selection_required' || code === 'server_not_found') toast('Gmail isn’t connected. Add it in claude.ai Settings, Connectors, or copy the email instead.');
      else if (code === 'not_in_manifest' || code === 'not_granted' || code === 'consent_required') toast('Gmail is turned off for this page. Allow it from the Permissions menu.');
      else { const [t, d] = explain(err); toast(t.replace('Supabase', 'Gmail') + '. ' + d); }
    }
    busy = false;
    await load();
  }

    if (problem) { const n = el('div', 'notice bad'); n.append(el('b', '', problem[0]), el('span', '', problem[1])); items.push(n); }
    const laneDef = LANES.find((x) => x.id === lane) || LANES[0];
    const term = $('q').value.trim().toLowerCase();
    const due = today();
    const shown = leads.filter(laneDef.test).filter((l) => !term || [l.business, l.area, l.niche, l.id].join(' ').toLowerCase().includes(term));
    // The top 5 open leads by next-best-move score get a rank, wherever they show up.
    const rankOf = {};
    leads.filter((l) => l.priority >= 0).slice(0, 5).forEach((l, i) => { rankOf[l.id] = i + 1; });
    if (lane === 'contacted') shown.sort((a, b) => String(a.next_followup || '9999').localeCompare(String(b.next_followup || '9999')));
    if (!shown.length && !problem && loadedAt) items.push(el('div', 'empty', term ? 'No leads match that search.' : 'Nobody here right now.'));
    shown.forEach((l) => {
      const card = el('article', 'lead' + (openId === l.id ? ' open' : '')); card.id = l.id;
      const head = el('button', 'row-head'); head.type = 'button'; head.setAttribute('aria-expanded', String(openId === l.id));
      const left = el('div'); left.append(el('div', 'nm', l.business), el('div', 'meta', [l.niche, l.area].filter(Boolean).join(' · ')));
      if (l.next_move) { const nx = el('div', 'next'); nx.append(el('b', '', rankOf[l.id] ? `#${rankOf[l.id]} move` : 'Next'), document.createTextNode(l.next_move)); left.append(nx); }
      const right = el('div', 'right'); right.append(el('span', 'heat ' + l.heat, l.heat), el('span', 'score', String(l.score)));
      const chips = el('div', 'chips');
      chips.append(el('span', 'chip stage', l.stage));
      [['email', 'Email'], ['phone', 'Phone'], ['facebook', 'Facebook']].forEach(([f, label]) => chips.append(el('span', 'chip' + (l[f] ? '' : ' off'), label)));
      if (l.has_case) chips.append(el('span', 'chip', 'Case file'));
      if (l.my_notes) chips.append(el('span', 'chip', 'My notes'));
      if ((photos[l.id] || []).length) chips.append(el('span', 'chip', (photos[l.id] || []).length + ' photos'));
      if (l.mockup_url) chips.append(el('span', 'chip', 'Mockup'));
      else if (l.mockup_requested) chips.append(el('span', 'chip', 'Mockup requested'));
      if (l.touches > 0) chips.append(el('span', 'chip', `${l.touches} touch${l.touches == 1 ? '' : 'es'}`));
      if (l.stage === 'Contacted' && l.next_followup && String(l.next_followup).slice(0, 10) <= due) chips.append(el('span', 'chip due', 'Follow-up due'));
      head.append(left, right, chips);
      head.addEventListener('click', () => { openId = openId === l.id ? null : l.id; confirmFor = null; render(); });
      card.append(head);
      if (openId === l.id) card.append(leadBody(l));
      items.push(card);
    });
    if (!mcp && !problem) { const n = el('div', 'notice'); n.textContent = 'Open this page in claude.ai, signed in with your Supabase connector, to see and update leads.'; items.push(n); }
    if (!loadedAt && mcp && !problem) items.push(el('div', 'skeleton'), el('div', 'skeleton'), el('div', 'skeleton'));
    list.replaceChildren(...items);
  }

  $('q').addEventListener('input', render);
  $('refresh').addEventListener('click', () => load());

  claude.use('assets').then((a) => { assets = a; render(); }, () => { assets = null; });
  claude.use('mcp').then((m) => {
    mcp = m;
    if (!mcp) { problem = null; render(); return; }
    load().then(() => { if (openId) { const e = document.getElementById(openId); if (e) e.scrollIntoView({ block: 'center' }); } });
  }, () => { mcp = null; render(); });
  render();
})();
</script>
