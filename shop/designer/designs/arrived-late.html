<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@500;600&family=Special+Elite&display=block">
<style>
/* Crewneck front, about 11 inches wide. An event timeline: two stops, then the review. */
:root{--ink:#1b1a18}
html,body{margin:0;background:transparent}
#art{width:max-content;padding:30px;color:var(--ink)}
.stop{display:grid;grid-template-columns:44px auto;column-gap:36px;position:relative}
.stop::before{content:"";position:absolute;left:18px;top:52px;bottom:-14px;border-left:8px dotted var(--ink)}
.stop.last::before{display:none}
.mark{width:44px;height:44px;border-radius:50%;background:var(--ink);margin-top:6px}
.last .mark{box-sizing:border-box;background:transparent;border:9px solid var(--ink);margin-top:34px}
.time{font:600 46px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;padding-top:4px}
.big{font:400 184px/.9 Anton,Impact,sans-serif;text-transform:uppercase;margin:12px 0 44px;white-space:nowrap}
.foot{display:flex;align-items:center;gap:34px;margin-top:6px}
.great{font:400 118px/1 "Special Elite",monospace;white-space:nowrap}
.note{font:500 32px/1.3 "IBM Plex Mono",monospace;letter-spacing:.04em;white-space:nowrap}
</style></head><body>
<div id="art">
  <div class="stop"><span class="mark"></span><div><div class="time">8:47 PM</div><div class="big">Arrived Late</div></div></div>
  <div class="stop"><span class="mark"></span><div><div class="time">9:12 PM</div><div class="big">Leaving Early</div></div></div>
  <div class="stop last"><span class="mark"></span><div class="foot"><div class="great">Great time.</div><div class="note">10/10<br>would leave<br>early again</div></div></div>
</div>
</body></html>
