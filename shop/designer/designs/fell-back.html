<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@600&display=block">
<style>
/* Hoodie front, about 10.5 inches wide. A clock stuck at 4:47 PM over two heavy lines. */
:root{--ink:#f3eee3}
html,body{margin:0;background:transparent}
#art{width:max-content;padding:30px;color:var(--ink);display:grid;justify-items:center;gap:0}
svg{width:240px;height:240px;margin-bottom:34px;transform:rotate(-14deg)}
.l{font:400 136px/1 "Archivo Black",sans-serif;text-transform:uppercase;letter-spacing:-.01em;white-space:nowrap}
.l2{margin-top:6px}
.rule{width:100%;border-top:9px solid var(--ink);margin:40px 0 28px}
.sub{font:600 36px/1 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
</style></head><body>
<div id="art">
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="44" fill="none" stroke="var(--ink)" stroke-width="6"/>
    <g stroke="var(--ink)" stroke-width="4" stroke-linecap="round">
      <line x1="50" y1="12" x2="50" y2="19"/><line x1="88" y1="50" x2="81" y2="50"/><line x1="50" y1="88" x2="50" y2="81"/><line x1="12" y1="50" x2="19" y2="50"/>
    </g>
    <!-- 4:47: hour hand at 143.5 degrees, minute hand at 282 degrees -->
    <line x1="50" y1="50" x2="66.1" y2="71.7" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="18.7" y2="43.3" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="5" fill="var(--ink)"/>
  </svg>
  <div class="l">Fell Back.</div>
  <div class="l l2">Never Got Up.</div>
  <div class="rule"></div>
  <div class="sub">One extra hour. Used poorly.</div>
</div>
</body></html>
