<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=IBM+Plex+Mono:wght@500;700&display=block">
<style>
/* Tee front, about 9.3 inches wide. An office ID badge on a clip. One ink color; the card is an outline so the shirt shows through. */
:root{--ink:#1b1a18}
html,body{margin:0;background:transparent}
#art{width:max-content;padding:24px;color:var(--ink);display:grid;justify-items:center}
.clip{width:150px;height:96px;border:12px solid var(--ink);border-bottom:none;border-radius:30px 30px 0 0;box-sizing:border-box}
.card{width:880px;box-sizing:border-box;border:14px solid var(--ink);border-radius:46px;padding:44px 50px 40px;display:grid;gap:30px}
.slot{width:150px;height:26px;border-radius:14px;background:var(--ink);justify-self:center;margin-top:-10px}
.top{display:flex;justify-content:space-between;align-items:center;font:700 34px/1 "IBM Plex Mono",monospace;letter-spacing:.18em;border-bottom:8px solid var(--ink);padding-bottom:22px}
.id{display:grid;grid-template-columns:230px 1fr;gap:40px;align-items:center}
.photo{width:230px;height:260px;border:10px solid var(--ink);box-sizing:border-box;border-radius:14px;display:grid;place-items:center}
.photo svg{width:150px;height:150px}
.name{font:900 92px/.92 Archivo,sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.role{font:500 34px/1.3 "IBM Plex Mono",monospace;margin-top:18px;letter-spacing:.04em}
.since{display:flex;justify-content:space-between;align-items:end;gap:30px}
.since b{font:700 60px/1 "IBM Plex Mono",monospace;letter-spacing:.04em;white-space:nowrap}
.since span{font:500 26px/1 "IBM Plex Mono",monospace;letter-spacing:.2em;display:block;margin-bottom:12px}
.bars{display:flex;align-items:stretch;height:110px;gap:0}
.bars i{display:block;background:var(--ink);height:100%}
</style></head><body>
<div id="art">
  <div class="clip"></div>
  <div class="card">
    <div class="slot"></div>
    <div class="top"><span>VISITOR</span><span>BLDG 2</span></div>
    <div class="id">
      <div class="photo">
        <svg viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="var(--ink)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 40h52v22a20 20 0 0 1-20 20H38a20 20 0 0 1-20-20z"/><path d="M70 46h6a10 10 0 0 1 0 20h-7"/>
          <path d="M34 28c0-6 6-6 6-12M48 28c0-6 6-6 6-12"/></g></svg>
      </div>
      <div><div class="name">Coffee<br>Badging</div><div class="role">Senior In-Office<br>Presence Specialist</div></div>
    </div>
    <div class="since"><div><span>SINCE</span><b>9:04 AM</b></div><div class="bars" id="bars"></div></div>
  </div>
</div>
<script>
  // A fixed, made-up barcode pattern (not a real code).
  const w = [6,3,9,3,3,6,12,3,6,3,3,9,3,6,6,3,12,3,3,6,9,3,6,3];
  const b = document.getElementById('bars');
  w.forEach((x, i) => { const e = document.createElement('i'); e.style.width = x + 'px'; e.style.marginRight = (i % 3 === 2 ? 9 : 5) + 'px'; b.append(e); });
</script>
</body></html>
