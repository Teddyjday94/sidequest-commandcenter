<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&display=block">
<style>
/* Hoodie left chest, print about 4 inches wide (rendered large so it stays sharp). An out of office auto-reply. */
:root{--ink:#1b1a18}
html,body{margin:0;background:transparent}
#art{width:max-content;padding:24px;color:var(--ink);display:grid;grid-template-columns:auto auto;column-gap:44px;align-items:start}
svg{width:190px;height:170px;margin-top:6px}
.head{font:700 46px/1 "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;padding-bottom:22px;margin-bottom:24px;border-bottom:8px solid var(--ink);white-space:nowrap}
.msg{font:700 92px/1.08 "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:-.01em;white-space:nowrap}
.small{font:500 38px/1.3 "IBM Plex Mono",monospace;margin-top:26px;letter-spacing:.04em;white-space:nowrap}
</style></head><body>
<div id="art">
  <svg viewBox="0 0 110 100" aria-hidden="true">
    <path d="M10 8h90a6 6 0 0 1 6 6v52a6 6 0 0 1-6 6H44L22 92V72H10a6 6 0 0 1-6-6V14a6 6 0 0 1 6-6z" fill="none" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="33" cy="40" r="6.5" fill="var(--ink)"/><circle cx="55" cy="40" r="6.5" fill="var(--ink)"/><circle cx="77" cy="40" r="5" fill="none" stroke="var(--ink)" stroke-width="3"/>
  </svg>
  <div>
    <div class="head">Auto-reply</div>
    <div class="msg">Will return<br>your text<br>in Q1.</div>
    <div class="small">Thank you for your patience.</div>
  </div>
</div>
</body></html>
